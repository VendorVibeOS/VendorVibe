name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create Service Account Key
        run: |
          echo '${{ secrets.FIREBASE_TOKEN }}' | base64 -d > /tmp/firebase-key.json

      - name: Deploy to Firebase
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json
          firebase deploy --only hosting --project vendorvibe-96980

      - name: Cleanup
        if: always()
        run: rm -f /tmp/firebase-key.json

      - name: Health Check
        run: |
          sleep 10
          curl -f https://vendorvibeos.web.app/ || exit 1